name: channel e2e

on:
  workflow_call:
    inputs:
      channel:
        description: Resolved release channel to test.
        required: true
        type: string
      ref:
        description: Repository revision to check out. Defaults to the caller revision.
        required: false
        type: string
        default: ""
      apply_mirror_update:
        description: Apply the mirror-update artifact before running the tests.
        required: false
        type: boolean
        default: false
      cachix_cache_name:
        description: Cachix cache used for package pulls and optional pushes.
        required: false
        type: string
        default: alexghr
    secrets:
      cachix_auth_token:
        description: Optional Cachix token used to push newly built paths.
        required: false

permissions:
  contents: read

jobs:
  test:
    name: test ${{ inputs.channel }} (x86_64-linux)
    runs-on: ubuntu-24.04
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.cachix_auth_token }}
      CACHIX_CACHE_NAME: ${{ inputs.cachix_cache_name }}
      TEST_CHANNEL: ${{ inputs.channel }}
    steps:
      - name: check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: download mirror update
        if: inputs.apply_mirror_update
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mirror-update

      - name: apply mirror update
        if: inputs.apply_mirror_update
        run: git apply --index mirror-update.patch

      - name: install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: configure cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17.0.0
        with:
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          name: ${{ env.CACHIX_CACHE_NAME }}

      - name: configure cachix pull only
        if: env.CACHIX_AUTH_TOKEN == ''
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17.0.0
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: run end-to-end tests
        run: AZTEC_READY_TIMEOUT=240 nix run -L --system x86_64-linux ".#${TEST_CHANNEL}-e2e"
