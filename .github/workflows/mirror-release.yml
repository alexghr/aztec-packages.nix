name: mirror aztec release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream Aztec release tag. Leave empty to poll configured channels.
        required: false
        type: string
      channel:
        description: Release channel to update, such as v4-stable, v4-nightly, or v5-nightly. Leave empty to infer from tag.
        required: false
        type: string
  repository_dispatch:
    types:
      - aztec-packages-release
  schedule:
    - cron: "12 12 * * *"

permissions:
  contents: write

concurrency:
  group: mirror-aztec-release
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror release
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME || 'alexghr' }}
    steps:
      - name: check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: main

      - name: install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: configure cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17.0.0
        with:
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          name: ${{ env.CACHIX_CACHE_NAME }}

      - name: configure cachix pull only
        if: env.CACHIX_AUTH_TOKEN == ''
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17.0.0
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: mirror release channels
        env:
          DISPATCH_CHANNEL: ${{ github.event.client_payload.channel || '' }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag || github.event.client_payload.release.tag_name || '' }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel || '' }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail

          args=()
          channel="${INPUT_CHANNEL:-$DISPATCH_CHANNEL}"
          tag="${INPUT_TAG:-$DISPATCH_TAG}"
          if [ -n "$channel" ]; then
            args+=(--channel "$channel")
          fi
          if [ -n "$tag" ]; then
            args+=(--tag "$tag")
          fi

          nix develop .#mirror --command scripts/mirror-channels.sh "${args[@]}"

      - name: detect changes
        id: changes
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: format
        if: steps.changes.outputs.changed == 'true'
        run: nix fmt

      - name: check flake
        if: steps.changes.outputs.changed == 'true'
        run: nix flake check -L --system x86_64-linux

      - name: build release packages
        if: steps.changes.outputs.changed == 'true'
        run: |
          nix build -L --no-link --system x86_64-linux \
            .#v4-stable \
            .#v4-nightly \
            .#v5-nightly

      - name: run end-to-end tests
        if: steps.changes.outputs.changed == 'true'
        run: AZTEC_READY_TIMEOUT=240 nix run -L --system x86_64-linux .#e2e

      - name: commit and push mirror update
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add versions.json node-runtime
          git commit -m "chore: mirror aztec release channels"
          git push origin HEAD:main
