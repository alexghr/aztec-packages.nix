name: mirror aztec release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream Aztec release tag. Leave empty to mirror the latest release.
        required: false
        type: string
  repository_dispatch:
    types:
      - aztec-packages-release
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mirror-aztec-release
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror release
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: resolve upstream tag
        id: release
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag || github.event.client_payload.release.tag_name || '' }}
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-$DISPATCH_TAG}"
          if [ -z "$tag" ]; then
            latest_json=$(curl --fail --location --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/AztecProtocol/aztec-packages/releases/latest")
            tag=$(printf "%s" "$latest_json" | nix develop --command jq -r '.tag_name // empty')
          fi

          if [ -z "$tag" ]; then
            echo "could not resolve an Aztec release tag" >&2
            exit 1
          fi

          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac

          branch_tag=$(printf "%s" "$tag" | tr -c "A-Za-z0-9._-" "-")

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$branch_tag" >> "$GITHUB_OUTPUT"

      - name: check mirror status
        id: mirrored
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if nix develop --command jq -e \
            --arg tag "$TAG" \
            ".latest == \$tag and (.releases[\$tag] != null)" \
            versions.json >/dev/null; then
            echo "$TAG is already mirrored as latest"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: mirror release metadata
        if: steps.mirrored.outputs.skip != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: nix develop --command scripts/mirror-release.sh "$TAG"

      - name: format
        if: steps.mirrored.outputs.skip != 'true'
        run: nix fmt

      - name: check flake
        if: steps.mirrored.outputs.skip != 'true'
        run: nix flake check -L --system x86_64-linux

      - name: build release packages
        if: steps.mirrored.outputs.skip != 'true'
        run: |
          nix build -L --no-link --system x86_64-linux \
            .#aztec-bin \
            .#aztec-bb \
            .#aztec-contracts \
            .#aztec-node-runtime \
            .#aztec-noir

      - name: create mirror pull request
        if: steps.mirrored.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            versions.json
            node-runtime/package.json
            node-runtime/package-lock.json
          branch: automation/mirror-aztec-${{ steps.release.outputs.branch_tag }}
          commit-message: "chore: mirror aztec ${{ steps.release.outputs.tag }}"
          delete-branch: true
          title: "chore: mirror aztec ${{ steps.release.outputs.tag }}"
          body: |
            Mirrors `${{ steps.release.outputs.tag }}` from `AztecProtocol/aztec-packages`.

            This was generated by `.github/workflows/mirror-release.yml`.
