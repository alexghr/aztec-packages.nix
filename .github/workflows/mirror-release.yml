name: mirror aztec release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream Aztec release tag. Leave empty to poll configured channels.
        required: false
        type: string
      channel:
        description: Release channel to update, such as v4-stable, v4-nightly, or v5-nightly. Leave empty to infer from tag.
        required: false
        type: string
  repository_dispatch:
    types:
      - aztec-packages-release
  schedule:
    - cron: "12 12 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mirror-aztec-release
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror release
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME || 'alexghr' }}
    steps:
      - name: check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: configure cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v15
        with:
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          name: ${{ env.CACHIX_CACHE_NAME }}

      - name: configure cachix pull only
        if: env.CACHIX_AUTH_TOKEN == ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: mirror release channels
        env:
          DISPATCH_CHANNEL: ${{ github.event.client_payload.channel || '' }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag || github.event.client_payload.release.tag_name || '' }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel || '' }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail

          args=()
          channel="${INPUT_CHANNEL:-$DISPATCH_CHANNEL}"
          tag="${INPUT_TAG:-$DISPATCH_TAG}"
          if [ -n "$channel" ]; then
            args+=(--channel "$channel")
          fi
          if [ -n "$tag" ]; then
            args+=(--tag "$tag")
          fi

          nix develop --command scripts/mirror-channels.sh "${args[@]}"

      - name: detect changes
        id: changes
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: format
        if: steps.changes.outputs.changed == 'true'
        run: nix fmt

      - name: check flake
        if: steps.changes.outputs.changed == 'true'
        run: nix flake check -L --system x86_64-linux

      - name: build release packages
        if: steps.changes.outputs.changed == 'true'
        run: |
          nix build -L --no-link --system x86_64-linux \
            .#aztec-bin \
            .#aztec-bb \
            .#aztec-contracts \
            .#aztec-node-runtime \
            .#aztec-noir

      - name: create mirror pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            versions.json
            node-runtime/**/package.json
            node-runtime/**/package-lock.json
          branch: automation/mirror-aztec-channels
          commit-message: "chore: mirror aztec release channels"
          delete-branch: true
          title: "chore: mirror aztec release channels"
          body: |
            Mirrors configured release channels from `AztecProtocol/aztec-packages`.

            This was generated by `.github/workflows/mirror-release.yml`.
