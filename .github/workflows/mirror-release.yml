name: mirror aztec release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream Aztec release tag. Leave empty to poll configured channels.
        required: false
        type: string
      channel:
        description: Release channel to update (e.g. v4-stable). Leave empty to infer from tag.
        required: false
        type: string
  repository_dispatch:
    types:
      - aztec-packages-release
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: mirror-aztec-release
  cancel-in-progress: false

jobs:
  mirror:
    name: prepare mirror update
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      changed: ${{ steps.mirror.outputs.changed }}
      has_failures: ${{ steps.mirror.outputs.has_failures }}
      failed_channels: ${{ steps.mirror.outputs.failed_channels }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME || 'alexghr' }}
    steps:
      - name: check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: main

      - name: record mirror base revision
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: configure cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17.0.0
        with:
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          name: ${{ env.CACHIX_CACHE_NAME }}

      - name: configure cachix pull only
        if: env.CACHIX_AUTH_TOKEN == ''
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17.0.0
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: mirror release channels independently
        id: mirror
        env:
          DISPATCH_CHANNEL: ${{ github.event.client_payload.channel || '' }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag || github.event.client_payload.release.tag_name || '' }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel || '' }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail

          channel="${INPUT_CHANNEL:-$DISPATCH_CHANNEL}"
          tag="${INPUT_TAG:-$DISPATCH_TAG}"
          normalized_tag=""

          if [ -n "$tag" ]; then
            case "$tag" in
              v*) normalized_tag=$tag ;;
              *) normalized_tag="v$tag" ;;
            esac
          fi

          nix develop .#mirror --command \
            scripts/check-channels.sh --allow-missing-releases

          mapfile -t configured_channels < <(jq -r '.channels | keys[]' channels.json)
          selected_channels=()

          if [ -n "$channel" ]; then
            if ! jq -e --arg channel "$channel" '.channels | has($channel)' channels.json >/dev/null; then
              echo "unknown release channel: $channel" >&2
              exit 1
            fi

            if [ -n "$normalized_tag" ]; then
              pattern=$(jq -r --arg channel "$channel" '.channels[$channel].pattern' channels.json)
              if ! printf "%s\n" "$normalized_tag" | grep -Eq -- "$pattern"; then
                echo "tag $normalized_tag does not match channel $channel pattern: $pattern" >&2
                exit 1
              fi
            fi

            selected_channels+=("$channel")
          elif [ -n "$tag" ]; then
            for configured_channel in "${configured_channels[@]}"; do
              pattern=$(jq -r --arg channel "$configured_channel" '.channels[$channel].pattern' channels.json)
              if printf "%s\n" "$normalized_tag" | grep -Eq -- "$pattern"; then
                selected_channels+=("$configured_channel")
              fi
            done
          else
            selected_channels=("${configured_channels[@]}")
          fi

          if [ "${#selected_channels[@]}" -eq 0 ]; then
            echo "no configured channel matched tag $tag"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          base=$(git rev-parse HEAD)
          aggregate=$base
          run_id=${GITHUB_RUN_ID:-$$}
          run_attempt=${GITHUB_RUN_ATTEMPT:-1}
          aggregate_ref="refs/mirror/aggregate-$run_id-$run_attempt"
          worktree_root=$(mktemp -d)
          active_worktree=""
          failures=()
          results=()

          cleanup() {
            status=$?
            trap - EXIT
            set +e
            if [ -n "$active_worktree" ]; then
              git worktree remove --force "$active_worktree" >/dev/null 2>&1 || true
            fi
            git update-ref -d "$aggregate_ref" >/dev/null 2>&1 || true
            rm -rf -- "$worktree_root"
            git worktree prune
            exit "$status"
          }
          trap cleanup EXIT
          git update-ref "$aggregate_ref" "$base"

          for selected_channel in "${selected_channels[@]}"; do
            if [[ ! "$selected_channel" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
              echo "unsafe release channel name: $selected_channel" >&2
              exit 1
            fi

            echo "::group::mirror $selected_channel"
            active_worktree="$worktree_root/$selected_channel"
            channel_log="$RUNNER_TEMP/mirror-$selected_channel.log"
            git worktree add --quiet --detach "$active_worktree" "$aggregate"

            args=(--channel "$selected_channel")
            if [ -n "$tag" ]; then
              args+=(--tag "$tag")
            fi

            if (
              cd "$active_worktree"
              nix develop .#mirror --command scripts/mirror-channels.sh "${args[@]}"
            ) 2>&1 | tee "$channel_log"; then
              git -C "$active_worktree" add -A -- versions.json node-runtime
              if git -C "$active_worktree" diff --cached --quiet -- versions.json node-runtime; then
                echo "$selected_channel is already up to date"
                results+=("$selected_channel: unchanged")
              else
                git -C "$active_worktree" commit --quiet --no-gpg-sign -m "chore: mirror $selected_channel"
                next=$(git -C "$active_worktree" rev-parse HEAD)
                git update-ref "$aggregate_ref" "$next" "$aggregate"
                aggregate=$next
                echo "mirrored $selected_channel"
                results+=("$selected_channel: updated")
              fi
            else
              failures+=("$selected_channel")
              results+=("$selected_channel: deferred")
              echo "::warning title=Deferred release channel::$selected_channel failed to mirror and will retry on the next sync"
              {
                echo "### Deferred channel: \`$selected_channel\`"
                echo
                echo '```text'
                tail -n 20 "$channel_log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi

            git worktree remove --force "$active_worktree"
            active_worktree=""
            echo "::endgroup::"
          done

          diff_status=0
          git diff --quiet "$base" "$aggregate" -- versions.json node-runtime || diff_status=$?
          case "$diff_status" in
            0)
              changed=false
              ;;
            1)
              changed=true
              git diff --binary --full-index "$base" "$aggregate" \
                -- versions.json node-runtime > mirror-update.patch
              ;;
            *)
              echo "failed to compare aggregate mirror update (git diff status $diff_status)" >&2
              exit "$diff_status"
              ;;
          esac

          failed_channels=$(IFS=,; echo "${failures[*]}")
          if [ "${#failures[@]}" -eq 0 ]; then
            has_failures=false
          else
            has_failures=true
          fi
          {
            echo "changed=$changed"
            echo "has_failures=$has_failures"
            echo "failed_channels=$failed_channels"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Channel mirror summary"
            echo
            echo "- Generated update: \`$changed\`"
            echo "- Deferred channels: \`${failed_channels:-none}\`"
            if [ "${#results[@]}" -eq 0 ]; then
              echo "- No configured channel selected"
            else
              for result in "${results[@]}"; do
                echo "- \`$result\`"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload mirror update
        if: steps.mirror.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mirror-update
          path: mirror-update.patch
          if-no-files-found: error
          retention-days: 1

  validate:
    name: validate ${{ matrix.system }}
    needs: mirror
    if: needs.mirror.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME || 'alexghr' }}
    steps:
      - name: check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.mirror.outputs.base_sha }}
          persist-credentials: false

      - name: download mirror update
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mirror-update

      - name: apply mirror update
        run: git apply --index mirror-update.patch

      - name: install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: configure cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17.0.0
        with:
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          name: ${{ env.CACHIX_CACHE_NAME }}

      - name: configure cachix pull only
        if: env.CACHIX_AUTH_TOKEN == ''
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17.0.0
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: check flake
        run: nix flake check -L --system "${{ matrix.system }}"

      - name: build release packages
        run: |
          set -euo pipefail

          mapfile -t channel_attrs < <(
            nix develop .#mirror --command scripts/list-channel-build-attrs.sh "${{ matrix.system }}"
          )
          nix build -L --no-link --system "${{ matrix.system }}" "${channel_attrs[@]}"

      - name: test v5-stable development shell
        run: nix develop .#v5-stable --command scripts/dev-shell-smoke-test.sh v5-stable

      - name: run end-to-end tests
        if: matrix.system == 'x86_64-linux'
        run: AZTEC_READY_TIMEOUT=240 nix run -L --system "${{ matrix.system }}" .#e2e

  validate-private-voting:
    name: validate private voting canary
    needs: mirror
    if: needs.mirror.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME || 'alexghr' }}
    steps:
      - name: check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.mirror.outputs.base_sha }}
          persist-credentials: false

      - name: download mirror update
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mirror-update

      - name: apply mirror update
        run: git apply --index mirror-update.patch

      - name: read private voting canary ref
        id: private_voting_ref
        run: |
          set -euo pipefail

          ref=$(tr -d '\r\n' < e2e/private-voting.ref)
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid private voting canary ref: $ref" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: check out private voting canary
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: aztec-labs-eng/aztec-private-voting
          ref: ${{ steps.private_voting_ref.outputs.ref }}
          path: .e2e/aztec-private-voting
          persist-credentials: false

      - name: install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: configure cachix pull only
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17.0.0
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: test v5-stable with private voting
        run: |
          nix develop .#v5-stable --command \
            scripts/private-voting-e2e.sh .e2e/aztec-private-voting v5-stable

  commit:
    name: commit and push mirror update
    needs:
      - mirror
      - validate
      - validate-private-voting
    if: needs.mirror.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.mirror.outputs.base_sha }}

      - name: download mirror update
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mirror-update

      - name: apply mirror update
        run: git apply mirror-update.patch

      - name: commit and push mirror update
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- versions.json node-runtime
          if git diff --cached --quiet; then
            echo "no mirror update to commit"
            exit 0
          fi

          git commit --no-gpg-sign -m "chore: mirror aztec release channels"
          git push origin HEAD:main

  report-failures:
    name: report deferred release channels
    needs:
      - mirror
      - validate
      - validate-private-voting
      - commit
    if: >-
      ${{
        always() &&
        needs.mirror.result == 'success' &&
        needs.mirror.outputs.has_failures == 'true'
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: report deferred release channels
        env:
          FAILED_CHANNELS: ${{ needs.mirror.outputs.failed_channels }}
        run: |
          echo "::error title=Deferred release channels::$FAILED_CHANNELS failed to mirror and will retry on the next sync"
          exit 1
