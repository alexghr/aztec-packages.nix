name: build aztec packages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-aztec-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-channels:
    name: discover test channels
    runs-on: ubuntu-24.04
    outputs:
      channels: ${{ steps.channels.outputs.channels }}
    steps:
      - name: check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: list resolved test channels
        id: channels
        run: |
          set -euo pipefail

          nix develop .#mirror --command \
            scripts/check-channels.sh channels.json versions.json >/dev/null
          # shellcheck disable=SC2016 # jq variables are intentionally single-quoted.
          channels=$(
            nix develop .#mirror --command jq -nc \
              --slurpfile config channels.json \
              --slurpfile state versions.json \
              '[
                $config[0].channels | keys[] as $channel
                | $state[0].channels[$channel].tag as $tag
                | select(
                    ($tag | type) == "string"
                    and ($state[0].releases[$tag].systems["x86_64-linux"].foundry? != null)
                    and ($state[0].releases[$tag].systems["x86_64-linux"].noir? != null)
                  )
                | $channel
              ]'
          )
          echo "channels=$channels" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME || 'alexghr' }}
    steps:
      - name: check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: configure cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17.0.0
        with:
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          name: ${{ env.CACHIX_CACHE_NAME }}

      - name: configure cachix pull only
        if: env.CACHIX_AUTH_TOKEN == ''
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17.0.0
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: check flake
        run: nix flake check -L --system "${{ matrix.system }}"

      - name: build channel packages
        run: |
          set -euo pipefail

          mapfile -t channel_attrs < <(
            nix develop .#mirror --command scripts/list-channel-build-attrs.sh "${{ matrix.system }}"
          )
          nix build -L --no-link --system "${{ matrix.system }}" "${channel_attrs[@]}"

      - name: test v5-stable development shell
        run: nix develop .#v5-stable --command scripts/dev-shell-smoke-test.sh v5-stable

  e2e:
    name: test ${{ matrix.channel }} (x86_64-linux)
    needs: test-channels
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.test-channels.outputs.channels) }}
    uses: ./.github/workflows/channel-e2e.yml
    with:
      channel: ${{ matrix.channel }}
      cachix_cache_name: ${{ vars.CACHIX_CACHE_NAME || 'alexghr' }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
