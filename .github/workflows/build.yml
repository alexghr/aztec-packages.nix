name: build aztec packages

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: build-aztec-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME || 'alexghr' }}
    steps:
      - name: check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: configure cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17.0.0
        with:
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          name: ${{ env.CACHIX_CACHE_NAME }}

      - name: configure cachix pull only
        if: env.CACHIX_AUTH_TOKEN == ''
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17.0.0
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: check flake
        run: nix flake check -L --system "${{ matrix.system }}"

      - name: build channel packages
        run: |
          nix build -L --no-link --system "${{ matrix.system }}" \
            .#v4-stable \
            .#v5-nightly \
            .#v5-rc

      - name: run end-to-end tests
        if: matrix.system == 'x86_64-linux'
        run: AZTEC_READY_TIMEOUT=240 nix run -L --system "${{ matrix.system }}" .#e2e
